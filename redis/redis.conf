# Redis cho Lab 01: lưu session và key chống replay OTP.
port 6379
bind 0.0.0.0
protected-mode yes

# User default bắt buộc mật khẩu; file ACL được tạo lúc container khởi động từ REDIS_PASSWORD.
aclfile /tmp/users.acl

# Key chống replay và session không được phép bị đẩy ra khi đầy bộ nhớ:
# mất key replay đồng nghĩa OTP cũ dùng lại được. Đầy thì báo lỗi ghi, không xóa ngầm.
maxmemory 64mb
maxmemory-policy noeviction

# Session là dữ liệu tạm, không ghi xuống đĩa.
save ""
appendonly no
